<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Ivory is a private, local-first AI photo curator for weddings and events. Import, analyse, rank and select photographs without uploading them anywhere."
    />
    <title>Ivory — Private photo curation</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('ivory.theme');
          const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#12110f' : '#faf9f6');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
